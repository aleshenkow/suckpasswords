services:
  db:
    image: postgres:16-alpine
    container_name: suckpasswords-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
    container_name: suckpasswords-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    networks:
      - internal

  # Daily pg_dump (custom format) kept in ./backups, 14 days retention.
  # Dumps contain encrypted secrets, but protect the directory anyway.
  db-backup:
    image: postgres:16-alpine
    container_name: suckpasswords-db-backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -Fc -f /backups/sp_$$(date +%Y%m%d_%H%M%S).dump \
            && find /backups -name 'sp_*.dump' -mtime +14 -delete
          sleep 86400
        done
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    container_name: suckpasswords-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
